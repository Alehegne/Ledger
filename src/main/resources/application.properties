spring.application.name=Ledger
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/Ledger_DB}
# spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/Ledger_DB}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}

spring.jpa.hibernate.ddl-auto=none
# spring.jpa.show-sql=true
spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.format_sql=false
# 2. Forcefully mute SQL statement logging from the engine level
logging.level.org.hibernate.SQL=ERROR

# 3. Forcefully mute SQL parameter/binding types logging (the most common cause of huge logs)
logging.level.org.hibernate.orm.results.loading=ERROR
logging.level.org.hibernate.resource.jdbc.internal.ResourceRegistryStandardImpl=ERROR
spring.jpa.open-in-view=false

spring.flyway.enabled=true

ledger.jwt.secret=${JWT_SECRET:ledger-dev-secret-change-me-in-production-1234567890}
ledger.jwt.issuer=${JWT_ISSUER:ledger}
ledger.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
ledger.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

ledger.super-admin.bootstrap.enabled=${LEDGER_SUPER_ADMIN_BOOTSTRAP_ENABLED:true}
ledger.super-admin.email=${LEDGER_SUPER_ADMIN_EMAIL:super.admin@ledger.test}
ledger.super-admin.password=${LEDGER_SUPER_ADMIN_PASSWORD:SuperAdmin123!}
ledger.super-admin.full-name=${LEDGER_SUPER_ADMIN_FULL_NAME:Platform Super Admin}
ledger.super-admin.organization=${LEDGER_SUPER_ADMIN_ORGANIZATION:Ledger Platform}
ledger.super-admin.currency=${LEDGER_SUPER_ADMIN_CURRENCY:USD}

ledger.seed.enabled=${LEDGER_SEED_ENABLED:false}
ledger.seed.organization=${LEDGER_SEED_ORGANIZATION:Ledger Bootstrap}
ledger.seed.currency=${LEDGER_SEED_CURRENCY:ETB}
ledger.seed.admin-email=${LEDGER_SEED_ADMIN_EMAIL:admin@ledger.test}
ledger.seed.admin-password=${LEDGER_SEED_ADMIN_PASSWORD:Admin123!}
ledger.seed.accountant-email=${LEDGER_SEED_ACCOUNTANT_EMAIL:accountant@ledger.test}
ledger.seed.accountant-password=${LEDGER_SEED_ACCOUNTANT_PASSWORD:Accountant123!}
ledger.seed.viewer-email=${LEDGER_SEED_VIEWER_EMAIL:viewer@ledger.test}
ledger.seed.viewer-password=${LEDGER_SEED_VIEWER_PASSWORD:Viewer123!}

ledger.idempotency.required=${LEDGER_IDEMPOTENCY_REQUIRED:true}
ledger.idempotency.ttl-hours=${LEDGER_IDEMPOTENCY_TTL_HOURS:24}
ledger.idempotency.in-progress-timeout-seconds=${LEDGER_IDEMPOTENCY_LOCK_TIMEOUT_SECONDS:30}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:3000}

ledger.outbox.topic=${LEDGER_OUTBOX_TOPIC:ledger.events}
ledger.outbox.dispatcher.enabled=${LEDGER_OUTBOX_DISPATCHER_ENABLED:true}
ledger.outbox.poll-delay-ms=${LEDGER_OUTBOX_POLL_DELAY_MS:1000}
ledger.outbox.batch-size=${LEDGER_OUTBOX_BATCH_SIZE:50}
ledger.outbox.max-retries=${LEDGER_OUTBOX_MAX_RETRIES:5}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=SUPER_ADMIN
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true

logging.structured.format.console=${LEDGER_LOG_FORMAT:logstash}